[package]
name = "jarvis"
version = "0.1.13"
description = "JARVIS desktop shell"
authors = ["Quantum Box"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["unstable"] }
tauri-plugin-http = { version = "2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "macos")'.dependencies]
aes = "0.8"
block2 = "0.6"
cbc = "0.1"
cookie = "0.18"
core-foundation = "0.10"
pbkdf2 = "0.13"
psl = "2.1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
objc2-app-kit = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["block2", "WKContentWorld", "WKFrameInfo", "WKWebView"] }
